[project]
name = "dataquantum-column-cleaner"
version = "0.1.0"
description = ""
authors = [
    {name = "jcarlossc",email = "jcarlossc1977@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "pandas (>=3.0.6,<4.0.0)"
]

[tool.poetry]
packages = [{include = "dataquantum_column_cleaner", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
cleaner = "dataquantum_column_cleaner.main:main"

[dependency-groups]
dev = [
    "mypy (>=2.4.0,<3.0.0)",
    "ruff (>=0.17.0,<0.18.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)",
    "taskipy (>=1.14.1,<2.0.0)"
]
