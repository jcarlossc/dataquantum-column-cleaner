repos:
  # Basic file checks.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  # Static analysis and Python formatting.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Type checking.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: poetry run mypy src
        language: system
        pass_filenames: false

      # Executes the automated tests.
      - id: pytest
        name: pytest
        entry: poetry run pytest
        language: system
        pass_filenames: false

      # Runs tests with coverage.
      - id: pytest-cov
        name: pytest-cov
        entry: poetry run pytest --cov=dataquantum_column_cleaner --cov-report=term-missing
        language: system
        pass_filenames: false
